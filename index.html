<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>坐席绩效业绩排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Notion 默认令牌 */
    --bg:#f6f5f4; --surface:#ffffff; --text:#000000; --muted:#757575;
    --accent:#0075de; --accent2:#097fe8; --hdr-bg:#0075de; --hdr-text:#ffffff;
    --row-alt:rgba(0,0,0,.03); --border:rgba(0,0,0,.08); --shadow:none;
    --badge1:#f64932; --badge2:#097fe8; --badge3:#ffb110;
    --font:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    --serif:'Source Serif Pro',Georgia,"Songti SC",serif;
    --radius-card:12px; --radius-pill:9999px; --radius-btn:8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .4s,color .4s;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:14px 20px 96px;}

  /* ===== Hero（Notion 风：暖白画布 + 紧排大标题 + 高亮药丸 + 编辑体副标） ===== */
  .hero{text-align:center;padding:8px 8px 4px;}
  .hero h1{
    margin:0;font-weight:700;color:var(--text);
    font-size:clamp(22px,4vw,38px);line-height:1.15;letter-spacing:-.02em;
  }
  .hero .hl{
    color:var(--accent);
  }
  .hero .period{
    margin-top:10px;font-family:var(--serif);font-weight:400;
    font-size:clamp(15px,2.4vw,18px);color:#615d59;line-height:1.56;
  }
  .hero .note{
    display:inline-block;margin-top:8px;background:#e6f3fe;color:var(--accent);
    border-radius:var(--radius-pill);padding:7px 16px;font-size:13px;font-weight:500;
  }

  /* ===== Controls（药丸输入框 + 统计） ===== */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:12px 0 8px;}
  .search-box{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-pill);padding:10px 18px;flex:1 1 280px;}
  .search-box svg{flex:0 0 auto;color:var(--muted);}
  .search-box input{border:0;outline:0;background:transparent;color:var(--text);
    font-size:15px;width:100%;font-family:inherit;}
  .search-box input::placeholder{color:var(--muted);}
  .clear-btn{border:0;background:var(--accent);color:#fff;border-radius:var(--radius-pill);
    width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto;display:none;}
  .stats{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap;}

  /* ===== 表格卡片（白底 + 1px 发丝边框，无阴影） ===== */
  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;}
  .table-scroll{position:relative;max-height:clamp(360px,56vh,600px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .table-scroll::-webkit-scrollbar{width:8px;}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  .table-scroll::-webkit-scrollbar-track{background:transparent;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  thead th{position:sticky;top:0;z-index:3;background:var(--hdr-bg);color:var(--hdr-text);
    font-weight:600;font-size:clamp(12px,2.1vw,15px);padding:15px 8px;text-align:center;
    letter-spacing:.2px;white-space:nowrap;}
  tbody td{text-align:center;padding:13px 8px;font-size:clamp(12px,2vw,14.5px);
    color:var(--text);vertical-align:middle;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  tbody tr:nth-child(even) td{background:var(--row-alt);}
  tbody tr:hover td{background:rgba(0,0,0,.05);}
  .rank-cell{font-weight:700;font-size:clamp(13px,2.2vw,16px);}
  .rank-1{color:var(--badge3);} .rank-2{color:#757575;} .rank-3{color:var(--badge1);}
  .col-team{font-weight:600;}
  .bonus-val{font-weight:700;font-variant-numeric:tabular-nums;}

  /* ===== 悬浮主题球（Notion 蓝主按钮） ===== */
  .theme-fab{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:60;}
  .fab-btn{width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:#fff;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;transition:transform .25s;}
  .fab-btn:hover{transform:scale(1.08) rotate(10deg);}
  .theme-panel{position:fixed;right:20px;top:50%;transform:translateY(-50%) scale(.92);
    width:min(300px,86vw);max-height:80vh;overflow-y:auto;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:0 18px 50px rgba(0,0,0,.14);
    padding:16px;z-index:61;opacity:0;pointer-events:none;transition:.22s;}
  .theme-panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);}
  .theme-panel h3{margin:2px 2px 12px;font-size:14px;font-weight:600;color:var(--text);
    display:flex;justify-content:space-between;align-items:center;}
  .theme-panel .close{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .theme-opt{border:2px solid transparent;border-radius:10px;padding:8px 4px;cursor:pointer;
    text-align:center;font-size:11.5px;font-weight:500;background:var(--bg);transition:.15s;color:var(--text);}
  .theme-opt:hover{transform:translateY(-2px);}
  .theme-opt.active{border-color:var(--accent);}
  .theme-opt .sw{width:100%;height:26px;border-radius:7px;margin-bottom:6px;border:1px solid rgba(0,0,0,.06);position:relative;}
  .theme-opt .sw::after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:var(--sw2);}
  .panel-hide{margin-top:14px;width:100%;border:1px solid var(--border);background:var(--bg);
    color:var(--muted);border-radius:var(--radius-btn);padding:9px;font-size:12.5px;font-weight:500;cursor:pointer;}
  .fab-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:60;
    background:var(--accent);color:#fff;border:0;border-radius:12px 0 0 12px;padding:12px 7px;
    font-size:13px;font-weight:600;cursor:pointer;writing-mode:vertical-rl;letter-spacing:3px;display:none;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7;}

  /* ===== 响应式 ===== */
  @media (max-width:680px){
    .wrap{padding:20px 12px 96px;}
    .controls{margin-top:18px;}
    .search-box{flex:1 1 100%;}
    .stats{flex:1 1 100%;text-align:left;}
    thead th{padding:12px 4px;font-size:12px;}
    tbody td{padding:10px 4px;font-size:12px;}
    .theme-fab,.theme-panel{right:12px;}
  }
  @media (min-width:681px) and (max-width:1024px){
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>坐席<span class="hl">绩效</span>业绩排行榜</h1>
    <div class="period" id="periodLine">数据期间加载中…</div>
    <div class="note">数据未含质量、考勤等，以最终绩效为准</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索姓名 / 列队…" autocomplete="off" />
      <button class="clear-btn" id="clearBtn" title="清除">×</button>
    </div>
    <div class="stats" id="statsLine"></div>
  </div>

  <div class="table-card">
    <div class="table-scroll" id="tableScroll">
      <table>
        <thead>
          <tr>
            <th>姓名</th><th>列队</th><th>报表话务量</th><th>漏接回拨</th>
            <th>计奖话务量</th><th>排名（按绩效奖金）</th><th>绩效奖金</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    本榜单为演示数据（共 100 人，覆盖 综合 / 人社 / 公教企 / 工单 等列队）<br/>
    绩效奖金依据「计奖话务量 → 奖金」阶梯表计算，主题可一键切换。
  </footer>
</div>

<div class="theme-fab" id="themeFab">
  <button class="fab-btn" id="fabBtn" title="切换主题">🎨</button>
</div>
<button class="fab-tab" id="fabTab">主题</button>
<div class="theme-panel" id="themePanel">
  <h3>选择主题 <button class="close" id="panelClose">×</button></h3>
  <div class="theme-grid" id="themeGrid"></div>
  <button class="panel-hide" id="panelHide">隐藏悬浮球</button>
</div>

<script>
/* =========================================================================
   可配置区域（按需修改）
   ========================================================================= */
const CONFIG = {
  // 各列队人数（可随意调整）
  teams: [
    { name: "综合",  count: 30 },
    { name: "人社",  count: 25 },
    { name: "公教企", count: 25 },
    { name: "工单",  count: 20 },
  ],
  // 绩效奖金「展示区间」（可配置：修改 label / min / max / color 即可）
  // 颜色采用 Notion 强调色：珊瑚红 / 信号蓝 / 金黄花
  bonusIntervals: [
    { label: "0-500",    min: 0,    max: 500,     color: "#f64932" },
    { label: "500-1000", min: 500,  max: 1000,    color: "#097fe8" },
    { label: "1000以上", min: 1000, max: Infinity, color: "#ffb110" },
  ],
  // 滚动速度（像素/秒，越小越慢）
  scrollSpeed: 30,
};

// 绩效奖金阶梯表（与《绩效奖金计算.xlsx》一致：计奖话务量 → 绩效奖金）
const BONUS_TABLE = [
  [100,100],[200,300],[300,500],[400,500],[500,700],[600,700],[700,1000],[800,1000],
  [900,1300],[1000,1500],[1100,1500],[1200,1500],[1300,1500],[1400,2000],[1500,2300],
  [1600,2300],[1700,2500],[1800,2700],[1900,2850],[2000,3000],[2100,3150],[2200,3300],
  [2300,3450],[2400,3600],[2500,3750],[2600,3900],[2700,4050],[2800,4200],[2900,4350],
  [3000,4500],[3100,4650],[3200,4800],[3300,4950],[3400,5100],[3500,5250],[3600,5400],
  [3700,5550],[3800,5700],[3900,5850],[4000,6000],[4100,6150]
];
function calcBonus(v){
  for(const [ub,b] of BONUS_TABLE){ if(v < ub) return b; }
  const extra = Math.ceil((v - 4100) / 100) * 150;
  return 6150 + Math.max(0, extra);
}

/* ---------- 生成模拟数据 ---------- */
const SURNAMES = "王李张刘陈杨黄赵周吴徐孙朱马胡郭何高林罗郑梁谢宋唐许韩冯邓曹彭曾肖田董袁潘于蒋蔡余杜叶程苏魏吕丁任沈姚卢傅钟姜崔谭廖范汪陆金石戴贾韦夏邱方侯邹熊孟秦白江阎薛尹段雷黎史龙陶贺顾毛郝龚邵万钱严覃武戚莫孔".split("");
const GIVEN = "伟芳娜秀英敏静丽强磊洋勇艳杰娟涛明超霞平刚文辉力军建国玉兰海燕志强春梅桂花婷雪峰波建华晓东志明俊杰晓明雅雯欣怡梓涵浩然宇轩子轩若曦梦琪佳怡思远嘉怡博文雨欣佳琪天佑佳鑫一鸣嘉睿晨曦子涵可昕佳宁艺涵雨泽鑫磊锦程浩宇欣妍子墨梓萱睿轩沐宸景行致远".split("");
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function makeName(used){
  for(let t=0;t<60;t++){
    const nm = SURNAMES[randInt(0,SURNAMES.length-1)] +
               GIVEN[randInt(0,GIVEN.length-1)] +
               (Math.random()<0.5 ? GIVEN[randInt(0,GIVEN.length-1)] : "");
    if(!used.has(nm)){ used.add(nm); return nm; }
  }
  const nm = SURNAMES[randInt(0,SURNAMES.length-1)] + "某" + randInt(100,999);
  used.add(nm); return nm;
}
function genData(){
  const used = new Set(); const rows = [];
  for(const team of CONFIG.teams){
    for(let i=0;i<team.count;i++){
      const report = randInt(80, 1250);
      const missed = randInt(0, Math.min(70, Math.floor(report*0.35)));
      const reward = Math.max(0, report - missed);
      const bonus = calcBonus(reward);
      rows.push({ name: makeName(used), team: team.name, report, missed, reward, bonus });
    }
  }
  rows.sort((a,b)=> b.bonus - a.bonus);
  rows.forEach((r,idx)=> r.rank = idx+1);
  return rows;
}
const ALL = genData();

/* ---------- 渲染 ---------- */
const tbody = document.getElementById("tbody");
const scroll = document.getElementById("tableScroll");

function rowHTML(r){
  const rankCls = r.rank<=3 ? "rank-"+r.rank : "";
  const bonusText = "¥"+r.bonus+"+";
  return `<tr>
    <td>${r.name}</td>
    <td class="col-team">${r.team}</td>
    <td>${r.report}</td>
    <td>${r.missed}</td>
    <td>${r.reward}</td>
    <td class="rank-cell ${rankCls}">${r.rank}</td>
    <td class="bonus-val">${bonusText}</td>
  </tr>`;
}

// 自动滚动（渲染全部 100 人 + 复制一份实现无缝循环）
let oneCopy = 0, scrollRAF = null, lastT = 0, scrollPaused = false;

function renderScroll(){
  const html = ALL.map(rowHTML).join("");
  // 复制一份用于无缝循环；两组名单完全相同，视觉上仍是这 100 人
  tbody.innerHTML = html + html;
  scroll.scrollTop = 0;
  lastT = 0;
  oneCopy = scroll.scrollHeight / 2;
  if(!scrollRAF) scrollRAF = requestAnimationFrame(tick);
  document.getElementById("statsLine").textContent = `共 ${ALL.length} 人`;
}

function tick(t){
  if(!lastT) lastT = t;
  const dt = (t - lastT) / 1000; lastT = t;
  if(!scrollPaused && oneCopy > 0 && scroll.scrollHeight > scroll.clientHeight + 2){
    scroll.scrollTop += CONFIG.scrollSpeed * dt;
    if(scroll.scrollTop >= oneCopy) scroll.scrollTop -= oneCopy; // 回到顶部，无缝衔接
  }
  scrollRAF = requestAnimationFrame(tick);
}

function renderSearch(q){
  const kw = q.trim().toLowerCase();
  const list = ALL.filter(r=>{
    if(!kw) return true;
    return r.name.toLowerCase().includes(kw) || r.team.toLowerCase().includes(kw);
  });
  oneCopy = 0; // 搜索结果不自动滚动
  scroll.scrollTop = 0;
  tbody.innerHTML = list.length
    ? list.map(rowHTML).join("")
    : `<tr><td colspan="7" style="padding:40px;color:var(--muted)">未找到匹配记录</td></tr>`;
  document.getElementById("statsLine").textContent = `匹配 ${list.length} 人`;
}

const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
searchInput.addEventListener("input", ()=>{
  const q = searchInput.value;
  clearBtn.style.display = q ? "block" : "none";
  if(q.trim()) renderSearch(q); else { document.getElementById("statsLine").textContent = `共 ${ALL.length} 人`; renderScroll(); }
});
clearBtn.addEventListener("click", ()=>{
  searchInput.value=""; clearBtn.style.display="none";
  document.getElementById("statsLine").textContent = `共 ${ALL.length} 人`; renderScroll();
});

// 鼠标悬停 / 触摸时暂停滚动，方便查看
scroll.addEventListener("pointerenter", ()=> scrollPaused = true);
scroll.addEventListener("pointerleave", ()=> scrollPaused = false);

(function setPeriod(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  document.getElementById("periodLine").textContent = `数据期间：${fmt(start)} 至 ${fmt(now)}（数据最新日期）`;
})();

/* =========================================================================
   主题系统（26 套，Notion 为默认）
   ========================================================================= */
const THEMES = [
  {name:"Notion",  bg:"#f6f5f4", surface:"#ffffff", text:"#000000", accent:"#0075de", accent2:"#097fe8", hdrBg:"#0075de", hdrText:"#ffffff"},
  {name:"海洋",  bg:"#eef6fb", surface:"#ffffff", text:"#0f2a3f", accent:"#0ea5b7", accent2:"#2563eb", hdrBg:"#0ea5b7", hdrText:"#ffffff"},
  {name:"落日",  bg:"#fff3ec", surface:"#fffaf6", text:"#3a1f12", accent:"#f97316", accent2:"#ef4444", hdrBg:"#fb923c", hdrText:"#ffffff"},
  {name:"森林",  bg:"#eef7ee", surface:"#ffffff", text:"#142a16", accent:"#16a34a", accent2:"#0d9488", hdrBg:"#15803d", hdrText:"#ffffff"},
  {name:"薰衣草",bg:"#f4f0fb", surface:"#ffffff", text:"#2a1f3a", accent:"#7c3aed", accent2:"#db2777", hdrBg:"#8b5cf6", hdrText:"#ffffff"},
  {name:"午夜",  bg:"#0b1020", surface:"#151c30", text:"#e6ecff", accent:"#38bdf8", accent2:"#818cf8", hdrBg:"#1e293b", hdrText:"#e6ecff"},
  {name:"玫瑰",  bg:"#fdf0f4", surface:"#ffffff", text:"#3a1420", accent:"#e11d8f", accent2:"#f43f5e", hdrBg:"#db2777", hdrText:"#ffffff"},
  {name:"翡翠",  bg:"#eafaf3", surface:"#ffffff", text:"#0c2e22", accent:"#059669", accent2:"#10b981", hdrBg:"#047857", hdrText:"#ffffff"},
  {name:"琥珀",  bg:"#fff8e8", surface:"#fffdf7", text:"#3a2a08", accent:"#d97706", accent2:"#f59e0b", hdrBg:"#f59e0b", hdrText:"#1f1402"},
  {name:"石板",  bg:"#eef1f5", surface:"#ffffff", text:"#1f2937", accent:"#475569", accent2:"#64748b", hdrBg:"#334155", hdrText:"#ffffff"},
  {name:"青蓝",  bg:"#e6fbff", surface:"#ffffff", text:"#06303a", accent:"#06b6d4", accent2:"#0891b2", hdrBg:"#0891b2", hdrText:"#ffffff"},
  {name:"品红",  bg:"#fceafb", surface:"#ffffff", text:"#3a0d36", accent:"#c026d3", accent2:"#a21caf", hdrBg:"#a21caf", hdrText:"#ffffff"},
  {name:"蓝绿",  bg:"#e7f7f5", surface:"#ffffff", text:"#0a2e2b", accent:"#14b8a6", accent2:"#0d9488", hdrBg:"#0d9488", hdrText:"#ffffff"},
  {name:"靛蓝",  bg:"#eef0fb", surface:"#ffffff", text:"#1a1f3a", accent:"#4f46e5", accent2:"#6366f1", hdrBg:"#4338ca", hdrText:"#ffffff"},
  {name:"珊瑚",  bg:"#fff0ec", surface:"#ffffff", text:"#3a1813", accent:"#fb7185", accent2:"#f43f5e", hdrBg:"#f43f5e", hdrText:"#ffffff"},
  {name:"薄荷",  bg:"#ecfbf3", surface:"#ffffff", text:"#0c2e1c", accent:"#34d399", accent2:"#2dd4bf", hdrBg:"#10b981", hdrText:"#042016"},
  {name:"流金",  bg:"#fff8e1", surface:"#fffdf2", text:"#3a2e05", accent:"#ca8a04", accent2:"#eab308", hdrBg:"#ca8a04", hdrText:"#ffffff"},
  {name:"梅紫",  bg:"#f6eefb", surface:"#ffffff", text:"#2e153a", accent:"#9333ea", accent2:"#a855f7", hdrBg:"#7e22ce", hdrText:"#ffffff"},
  {name:"钢蓝",  bg:"#eef2f6", surface:"#ffffff", text:"#1e293b", accent:"#3b82f6", accent2:"#60a5fa", hdrBg:"#2563eb", hdrText:"#ffffff"},
  {name:"绯红",  bg:"#fdecec", surface:"#ffffff", text:"#3a0f0f", accent:"#dc2626", accent2:"#ef4444", hdrBg:"#b91c1c", hdrText:"#ffffff"},
  {name:"水玉",  bg:"#e9fbff", surface:"#ffffff", text:"#06343f", accent:"#22d3ee", accent2:"#06b6d4", hdrBg:"#06b6d4", hdrText:"#04222a"},
  {name:"蜜桃",  bg:"#fff1ea", surface:"#ffffff", text:"#3a2013", accent:"#fb923c", accent2:"#fdba74", hdrBg:"#fb923c", hdrText:"#3a1f0a"},
  {name:"紫罗兰",bg:"#f1ecfb", surface:"#ffffff", text:"#241a3a", accent:"#8b5cf6", accent2:"#a78bfa", hdrBg:"#7c3aed", hdrText:"#ffffff"},
  {name:"青柠",  bg:"#f4fbe9", surface:"#ffffff", text:"#1f2e08", accent:"#84cc16", accent2:"#a3e635", hdrBg:"#65a30d", hdrText:"#14210a"},
  {name:"藏青",  bg:"#eaf0f7", surface:"#ffffff", text:"#10243f", accent:"#1e40af", accent2:"#3b82f6", hdrBg:"#1e3a8a", hdrText:"#ffffff"},
  {name:"Geniestudio", bg:"#ebf5ff", surface:"#fafdff", text:"#0a0d12", accent:"#0069e0", accent2:"#0099ff", hdrBg:"#181d27", hdrText:"#ffffff"}
];

function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function rgba(hex,a){ const [r,g,b]=hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function applyTheme(i){
  const t = THEMES[i]; const r = document.documentElement.style;
  r.setProperty("--bg", t.bg); r.setProperty("--surface", t.surface);
  r.setProperty("--text", t.text);
  r.setProperty("--muted", rgba(t.text, .55));
  r.setProperty("--accent", t.accent); r.setProperty("--accent2", t.accent2);
  r.setProperty("--hdr-bg", t.hdrBg); r.setProperty("--hdr-text", t.hdrText);
  r.setProperty("--row-alt", rgba(t.text, .035));
  r.setProperty("--border", rgba(t.text, .10));
  r.setProperty("--badge3", t.accent2);
  try{ localStorage.setItem("perfTheme", i); }catch(e){}
  document.querySelectorAll(".theme-opt").forEach((el,idx)=> el.classList.toggle("active", idx===i));
}

const grid = document.getElementById("themeGrid");
grid.innerHTML = THEMES.map((t,i)=>
  `<div class="theme-opt" data-i="${i}" title="${t.name}">
     <div class="sw" style="background:${t.accent};--sw2:${t.accent2}"></div>${t.name}
   </div>`).join("");
grid.querySelectorAll(".theme-opt").forEach(el=>{
  el.addEventListener("click", ()=> applyTheme(+el.dataset.i));
});

const fab = document.getElementById("themeFab");
const panel = document.getElementById("themePanel");
const fabTab = document.getElementById("fabTab");
document.getElementById("fabBtn").addEventListener("click", ()=> panel.classList.toggle("open"));
document.getElementById("panelClose").addEventListener("click", ()=> panel.classList.remove("open"));
document.getElementById("panelHide").addEventListener("click", ()=>{
  fab.style.display="none"; panel.classList.remove("open"); fabTab.style.display="block";
});
fabTab.addEventListener("click", ()=>{ fab.style.display="block"; fabTab.style.display="none"; panel.classList.add("open"); });

(function init(){
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem("perfTheme")||"0",10)||0; }catch(e){}
  applyTheme(saved);
  document.getElementById("statsLine").textContent = `共 ${ALL.length} 人`;
  renderScroll();
})();
</script>
</body>
</html>
